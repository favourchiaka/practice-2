    <script>const savedName = localStorage.getItem('savedName');
        const savedEmail = localStorage.getItem('savedEmail');
        const savedAge = localStorage.getItem('savedAge')
        const savedPassword = localStorage.getItem('savedPassword');
        document.write("<h1> WELCOME " + savedName + "!</h1>");
        document.write("<p>Try to guess the number between 1 and 100!</p>");
        document.write("<input type='text' id='guess' placeholder='Enter your guess'>");
        document.write("<button onclick='checkGuess()' class='guessbtn'>Guess</button>");
        document.write("<p id='feedback'></p>");
        const randomNumber = Math.floor(Math.random() * 100) + 1;
        function checkGuess() {
            const userGuess = parseInt(document.getElementById('guess').value);
            const feedback = document.getElementById('feedback');
            if (userGuess === randomNumber) {
                feedback.textContent = 'Congratulations! You guessed the number!';
            } else if (userGuess < randomNumber) {
                feedback.textContent = 'Too low! Try again.';
            } else {
                feedback.textContent = 'Too high! Try again.';
            }
  
            }

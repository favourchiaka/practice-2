<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="pages.css">
</head>
<body>
<h1>Calculator</h1><h2>By favour.com</h2>
<input type="number" id="num1" placeholder="First number">
<input type="number" id="num2" placeholder="Second number">
<button onclick="calculateSum()" class="add">Add</button><br><br>
<button onclick="calculateSub()" class="subtract">Subtract</button><br><br>
<button onclick="calculateMul()" class="multiply">Multiply</button><br><br>
<button onclick="calculateDiv()" class="divide">Divide</button>
<p id="result"></p>
<script>
function calculateSum() {
    var number1 = parseFloat(document.getElementById('num1').value);
    var number2 = parseFloat(document.getElementById('num2').value);
    var sum = number1 + number2;
    document.getElementById('result').textContent = 'Result: ' + sum;

}
function calculateSub() {
    var number1 = (document.getElementById('num1').value);
    var number2 = (document.getElementById('num2').value);
    var difference = number1 - number2;
    document.getElementById('result').textContent = 'Result: ' + difference;
}
function calculateMul() {
    var number1 = (document.getElementById('num1').value);
    var number2 = (document.getElementById('num2').value);
    var product = number1 * number2;
    document.getElementById('result').textContent = 'Result: ' + product;
}
function calculateDiv() {
    var number1 = (document.getElementById('num1').value);
    var number2 = (document.getElementById('num2').value);
    var quotient = number1 / number2;
    document.getElementById('result').textContent = 'Result: ' + quotient;
}
</script>
</body>
</html>
